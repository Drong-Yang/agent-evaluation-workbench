name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run offline regression tests
        run: python -B -m unittest discover -s examples/seven_dimensions -p "test_*.py" -v
      - name: Exercise all scenarios without API calls
        run: python -B examples/seven_dimensions/run.py --offline --all --repeat 2
